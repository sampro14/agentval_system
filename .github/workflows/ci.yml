name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy agenteval
      # Base sandbox image so the executor integration tests run for real (browser image is skipped: ~2GB).
      - run: docker build -f agenteval/execution/docker/sandbox.Dockerfile -t agenteval-sandbox:latest .
      - run: uv run pytest -q -rs
