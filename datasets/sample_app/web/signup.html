<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Create an account</title>
</head>
<body>
  <h1>Create an account</h1>
  <form id="signup-form" method="dialog">
    <label for="signup-email">Email</label>
    <input id="signup-email" name="email" type="text" autocomplete="email">

    <label for="signup-password">Password</label>
    <input id="signup-password" name="password" type="password" autocomplete="new-password">

    <label for="signup-confirm">Confirm password</label>
    <input id="signup-confirm" name="confirm" type="password" autocomplete="new-password">

    <button id="signup-submit" type="submit">Sign up</button>
  </form>
  <p>Already registered? <a href="login.html">Sign in</a></p>
</body>
</html>
