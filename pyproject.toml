[project]
name = "agenteval"
version = "0.1.0"
description = "Multi-agent reliability & evaluation platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=1.8.0",
    "asyncpg>=0.31.0",
    "docker>=7.2.0",
    "fastapi>=0.141.1",
    "langgraph>=1.2.12",
    "pydantic-settings>=2.15.0",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.1",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agenteval"]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
    "types-docker>=7.2.0.20260923",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["agenteval/storage/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["agenteval/storage/migrations/"]

[[tool.mypy.overrides]]
module = ["docker.*"]
ignore_missing_imports = true
